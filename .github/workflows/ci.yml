name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify repository and model
        shell: bash
        run: |
          set -eux

          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== Git status ==="
          git status --short

          echo "=== Model in Git ==="
          git ls-tree -l HEAD models/best_model.joblib

          echo "=== Model file ==="
          ls -lah models/best_model.joblib

          echo "=== Model size ==="
          wc -c models/best_model.joblib

          echo "=== Test file ==="
          ls -lah tests/test_api.py

          test -f models/best_model.joblib
          test -s models/best_model.joblib

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Verify Python model loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import joblib

          model_path = Path("models/best_model.joblib")

          print("Model path:", model_path.resolve())
          print("Exists:", model_path.exists())
          print("Size:", model_path.stat().st_size)

          model = joblib.load(model_path)

          print("Model loaded successfully")
          print("Model type:", type(model))
          PY

      - name: Run tests
        shell: bash
        run: |
          pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify model before Docker build
        shell: bash
        run: |
          set -eux

          git rev-parse HEAD
          git ls-tree -l HEAD models/best_model.joblib
          ls -lah models/best_model.joblib
          test -f models/best_model.joblib
          test -s models/best_model.joblib

      - name: Build Docker image
        run: |
          docker build -t customer-churn-api:latest .