name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx2

      - name: Check model file
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== WORKING DIRECTORY ==="
          pwd

          echo "=== REPOSITORY ROOT ==="
          ls -la

          echo "=== MODELS DIRECTORY ==="
          if [ -d models ]; then
            ls -lah models
          else
            echo "ERROR: models directory does not exist"
            exit 1
          fi

          echo "=== GIT TRACKED MODEL ==="
          git ls-files -s models/best_model.joblib

          echo "=== MODEL FILE CHECK ==="
          if [ -f models/best_model.joblib ]; then
            echo "MODEL EXISTS"
            ls -lh models/best_model.joblib
          else
            echo "ERROR: MODEL DOES NOT EXIST"
            exit 1
          fi

      - name: Run tests
        run: |
          pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t customer-churn-api:latest .